<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Drigs Rafting Company</title>
    <meta name="description"
      content="Get in touch with the Drigs Rafting team. Contact us via phone, email, or our online form for fast support and inquiries. We are here to help.">
    <meta name="author" content="Ojelade Ifeoluwa">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raftin-logo.png" alt="rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li> 
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/rafting_banner.jpg" alt="Rafters paddling down the river">
            <h1>Contact Us</h1>
        </div>
        <section class="contact-info">
            <h2>Get In Touch</h2>
            <address>
                Pleasure Pack, Aba Road, Port Harcourt, Rivers State, Nigeria<br>
                Phone: <a href="tel:+2348064540495">+234 8064 540 495</a><br>
                Email: <a href="mailto:info@drigsrafting.com">info@drigsrafting.com</a>
            </address>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.608068744566!2d7.013293300000008!3d4.837165400000007!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1069cd0024c4e425%3A0xf7bf2f2781621431!2sPleasure%20park!5e0!3m2!1sen!2sng!4v1785586451146!5m2!1sen!2sng" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-list">
                <figure>
                    <img src="images/patrick.jpg" alt="Photo of Patrick Praise, Lead River Guide">
                    <figcaption>
                        <strong>Patrick Praise</strong><br>Lead River Guide
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/aminat.avif" alt="Photo of Aminat Odebode, Operations Manager">
                    <figcaption>
                        <strong>Aminat Odebode</strong><br>Operations Manager
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/rebeccasam.avif" alt="Photo of Isaiah Sam, Safety Coordinator">
                    <figcaption>
                        <strong>Rebecca Sam</strong><br> Safety Coordinator
                    </figcaption>
                </figure>
            </div>
        </section>
        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
                <table>
                    <tr>
                        <td><label for="name">Name:</label></td>
                        <td><input type="text" id="name" name="name" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" id="email" name="email" required></td>
                    </tr>
                    <tr>
                        <td>Purpose of Message:</td>
                        <td>
                            <input type="radio" id="general" name="purpose" value="general">
                            <label for="general">General Inquiry</label><br>

                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label><br>

                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="message">Message:</label></td>
                        <td><textarea id="message" name="message" rows="4" required></textarea></td>
                    </tr>
                    <tr>
                        <td><label for="newsletter">Newsletter:</label></td>
                        <td>
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                        </td>
                    </tr>
                </table>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 🌴 Drigs 🌴 Ojelade Ifeoluwa</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-logo.webp" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-icon.webp" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-logo.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
